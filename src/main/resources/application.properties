# Spring Application Name
spring.application.name=FleetSafe Platform
spring.threads.virtual.enabled=true

# Spring Profiles Configuration
spring.profiles.default=dev

# Spring DataSource Configuration
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.bitmeisters.fleetsafe.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Spring Message Source Configuration
spring.messages.fallback-to-system-locale=false

# Documentation Configuration
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://1asi0729-2620-16692-bitmeisters.github.io}

# Authorization Configuration
authorization.jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS:86400}

# Administrator Seeding Configuration
iam.administrator.email=${ADMIN_EMAIL:}
iam.administrator.password=${ADMIN_PASSWORD:}
iam.administrator.company-id=${ADMIN_COMPANY_ID:}

# Vehicle Documentation Configuration
vehicle-documentation.time-zone=${DOCUMENTATION_TIME_ZONE:America/Lima}
vehicle-documentation.status-recalculation.cron=0 0 5 * * *

# Email Configuration
resend.base-url=https://api.resend.com
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:FleetSafe <onboarding@resend.dev>}
resend.recipient-override=${RESEND_RECIPIENT_OVERRIDE:}

# Proxy Configuration
server.forward-headers-strategy=framework
