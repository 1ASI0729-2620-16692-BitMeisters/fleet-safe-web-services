openapi: 3.1.0
info:
  title: FleetSafe API - Fleet Management
  version: 0.1.0
paths:
  /drivers/me/vehicle-assignment:
    get:
      tags: [Fleet Management]
      operationId: getMyVehicleAssignment
      summary: Get the active vehicle assignment of the signed-in driver
      description: >-
        Roles: DRIVER. The driver comes from the token. A driver has at most one active
        assignment; 404 when there is none.
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The active assignment, with the assigned vehicle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAssignmentResource'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

  /drivers:
    get:
      tags: [Fleet Management]
      operationId: getDrivers
      summary: List the drivers of the company
      description: 'Roles: FLEET_SUPERVISOR, ADMINISTRATOR. Ordered by registration.'
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Drivers of the company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverResource'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    post:
      tags: [Fleet Management]
      operationId: registerDriver
      summary: Register a driver
      description: >-
        Roles: FLEET_SUPERVISOR, ADMINISTRATOR. Registers the license of the driver of an existing
        user account. A user account can be registered as a driver only once.
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDriverResource'
      responses:
        '201':
          description: Driver registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResource'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '422':
          description: The user account does not exist.
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'

  /vehicle-assignments:
    get:
      tags: [Fleet Management]
      operationId: getVehicleAssignments
      summary: List the vehicle assignments of the company
      description: >-
        Roles: FLEET_SUPERVISOR, ADMINISTRATOR. Newest first, with the closed ones as history.
        Send active=true to see only the ones in force.
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
        - name: active
          in: query
          required: false
          description: Only the assignments in force.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Assignments of the company.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAssignmentListItemResource'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
    post:
      tags: [Fleet Management]
      operationId: assignVehicleToDriver
      summary: Assign a vehicle to a driver
      description: >-
        Roles: FLEET_SUPERVISOR, ADMINISTRATOR. The vehicle must be enabled, the license of the driver
        must be in force, and neither of them can have another active assignment. The assignment
        starts today. Rejected with 409 when the vehicle or the driver already has an active assignment
        and with 422 when the vehicle or the driver is not in the company, the vehicle is not enabled
        or the license has expired.
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignVehicleResource'
      responses:
        '201':
          description: Vehicle assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAssignmentListItemResource'
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'
        '422':
          description: The vehicle or the driver is not in the company, the vehicle is not enabled or the license has expired.
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/Problem'

  /vehicle-assignments/{id}/close:
    parameters:
      - $ref: './common.yaml#/components/parameters/Id'
    post:
      tags: [Fleet Management]
      operationId: closeVehicleAssignment
      summary: Close a vehicle assignment
      description: >-
        Roles: FLEET_SUPERVISOR, ADMINISTRATOR. Ends the assignment today and keeps it as history.
        The vehicle and the driver can then be assigned again.
      parameters:
        - $ref: './common.yaml#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Assignment closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAssignmentListItemResource'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.yaml#/components/responses/Conflict'

components:
  schemas:
    VehicleSummaryResource:
      type: object
      required: [id, plate, brand, model, year, type, currentStatus]
      properties:
        id:
          type: string
          format: uuid
          examples: [4d5e6f7a-8b9c-4d0e-af1b-2c3d4e5f6a7b]
        plate:
          type: string
          examples: [ABC-123]
        brand:
          type: string
          examples: [Volvo]
        model:
          type: string
          examples: [FH 460]
        year:
          type: integer
          examples: [2022]
        type:
          type: string
          examples: [Tractor unit]
        currentStatus:
          $ref: './common.yaml#/components/schemas/VehicleStatus'

    VehicleAssignmentResource:
      type: object
      required: [id, driverId, assignedFrom, isActive, createdAt, vehicle]
      properties:
        id:
          type: string
          format: uuid
          examples: [9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d]
        driverId:
          type: string
          format: uuid
          examples: [2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f]
        assignedFrom:
          type: string
          format: date
          examples: ['2026-09-01']
        assignedTo:
          type: [string, 'null']
          format: date
          examples: [null]
        isActive:
          type: boolean
          examples: [true]
        createdAt:
          type: string
          format: date-time
          examples: ['2026-09-01T14:00:00Z']
        vehicle:
          $ref: '#/components/schemas/VehicleSummaryResource'

    DriverResource:
      type: object
      required: [id, userId, licenseNumber, licenseExpirationDate, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e]
        userId:
          type: string
          format: uuid
          description: User account of the driver, kept by Identity and Access.
          examples: [2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f]
        licenseNumber:
          type: string
          maxLength: 20
          examples: [Q12345678]
        licenseExpirationDate:
          type: string
          format: date
          description: Day the license expires. It is in force on that day.
          examples: ['2028-05-30']
        createdAt:
          type: string
          format: date-time
          examples: ['2026-10-01T11:00:00Z']
        updatedAt:
          type: string
          format: date-time
          examples: ['2026-10-01T11:00:00Z']

    RegisterDriverResource:
      type: object
      required: [userId, licenseNumber, licenseExpirationDate]
      properties:
        userId:
          type: string
          format: uuid
          examples: [2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f]
        licenseNumber:
          type: string
          maxLength: 20
          examples: [Q12345678]
        licenseExpirationDate:
          type: string
          format: date
          examples: ['2028-05-30']

    AssignVehicleResource:
      type: object
      required: [vehicleId, driverId]
      properties:
        vehicleId:
          type: string
          format: uuid
          examples: [4d5e6f7a-8b9c-4d0e-af1b-2c3d4e5f6a7b]
        driverId:
          type: string
          format: uuid
          examples: [7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e]

    VehicleAssignmentListItemResource:
      type: object
      required: [id, vehicleId, driverId, assignedFrom, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d]
        vehicleId:
          type: string
          format: uuid
          examples: [4d5e6f7a-8b9c-4d0e-af1b-2c3d4e5f6a7b]
        driverId:
          type: string
          format: uuid
          examples: [7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e]
        assignedFrom:
          type: string
          format: date
          examples: ['2026-11-14']
        assignedTo:
          type: [string, 'null']
          format: date
          examples: [null]
        isActive:
          type: boolean
          examples: [true]
        createdAt:
          type: string
          format: date-time
          examples: ['2026-11-14T14:00:00Z']
        updatedAt:
          type: string
          format: date-time
          examples: ['2026-11-14T14:00:00Z']
